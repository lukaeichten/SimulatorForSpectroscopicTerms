server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects (e.g. adding the trailing slash to /docs/user/method) use relative URLs, so they
    # keep the host, port and scheme of the request even behind a port mapping or a proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    # The "page not found" page of the documentation, copied to the root by the build.
    error_page 404 /404.html;

    # Bundled assets of the simulator (/assets/) and the documentation (/docs/assets/) carry a
    # content hash in their file name and never change.
    location ~ ^/(docs/)?assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ =404;
    }
}
