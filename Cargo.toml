[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Luka Eichten"]
repository = "https://github.com/lukaeichten/SimulatorForSpectroscopicTerms"

[workspace.dependencies]
simulator-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# `ml` and `ms` (the projections M_L and M_S) are domain terms that clippy considers too similar.
similar_names = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
